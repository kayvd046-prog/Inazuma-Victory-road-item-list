# Draait de browsertests uit tests/ bij elke push, op elke branch.
#
# Eerst worden de pagina's opnieuw gegenereerd, zoals build-pages.yml dat op
# main doet. Zo wordt getest wat er na die workflow live komt, ook als iemand
# alleen index.html heeft aangepast.
name: Test the site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Generate pages
        run: python3 tools/build-pages.py

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: tests
        run: npx playwright test

      # Bij een rode run: het rapport met screenshots en traces van wat misging.
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7
